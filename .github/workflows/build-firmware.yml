name: Build Router Firmware

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - prerelease
          - none
      release_notes:
        description: 'Release Notes'
        required: false
      enable_pppoe:
        description: '是否配置 PPPoE 拨号（默认 DHCP 客户端，不启用 PPPoE）'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      pppoe_account:
        description: 'PPPoE 宽带账号（enable_pppoe=yes 时必填）'
        required: false
      pppoe_password:
        description: 'PPPoE 宽带密码（enable_pppoe=yes 时必填）'
        required: false
      enable_ipv6:
        description: '是否启用 IPv6（默认 no：关闭 WAN6 / LAN RA/DHCPv6 与 IPv6 防火墙）'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Get current date
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Get commit hash
        id: commit
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "full=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang gcc g++ binutils bzip2 gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip wget xsltproc zlib1g-dev file which perl sed make

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 下载 mihomo 预编译二进制 (MetaCubeX releases, 供 nikki 使用, 不自行编译)
        run: |
          set -euo pipefail
          VERSION="1.19.27"
          URL="https://github.com/MetaCubeX/mihomo/releases/download/v${VERSION}/mihomo-linux-arm64-v${VERSION}.gz"
          echo "下载: $URL"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 -o /tmp/mihomo.gz "$URL"
          mkdir -p files/usr/libexec
          gzip -dc /tmp/mihomo.gz > files/usr/libexec/mihomo
          chmod 0755 files/usr/libexec/mihomo
          mkdir -p files/usr/bin
          ln -sf /usr/libexec/mihomo files/usr/bin/mihomo
          file files/usr/libexec/mihomo
          ls -lah files/usr/libexec/mihomo

      - name: 预下载 nikki geox 数据集 (geoip/geosite/mmdb, 首次启动免下载)
        run: |
          set -euo pipefail
          NIKKI_RUN_DIR="files/etc/nikki/run"
          mkdir -p "$NIKKI_RUN_DIR"
          wget -q --timeout=60 -t 3 "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat" -O "$NIKKI_RUN_DIR/geoip.dat"
          wget -q --timeout=60 -t 3 "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat" -O "$NIKKI_RUN_DIR/geosite.dat"
          wget -q --timeout=60 -t 3 "https://github.com/Loyalsoldier/geoip/releases/latest/download/Country.mmdb" -O "$NIKKI_RUN_DIR/country.mmdb"
          for f in geoip.dat geosite.dat country.mmdb; do
            if [ ! -s "$NIKKI_RUN_DIR/$f" ]; then
              echo "错误: geox 数据集 $f 下载失败或为空, 终止构建"
              exit 1
            fi
          done
          ls -lah "$NIKKI_RUN_DIR"

      - name: 写入构建配置 (PPPoE 默认 DHCP / IPv6 默认关闭, 可选开启)
        run: |
          set -euo pipefail
          ENABLE_PPPOE="${{ inputs.enable_pppoe }}"
          PPPOE_ACCOUNT="${{ inputs.pppoe_account }}"
          PPPOE_PASSWORD="${{ inputs.pppoe_password }}"
          ENABLE_IPV6="${{ inputs.enable_ipv6 }}"
          if [ "$ENABLE_PPPOE" = "yes" ]; then
            if [ -z "$PPPOE_ACCOUNT" ] || [ -z "$PPPOE_PASSWORD" ]; then
              echo "错误: 启用 PPPoE 时必须填写宽带账号和密码"
              exit 1
            fi
            echo "PPPoE 已启用: $PPPOE_ACCOUNT"
          else
            echo "默认 DHCP 客户端 (不启用 PPPoE)"
          fi
          mkdir -p files/etc/config
          printf 'enable_pppoe=%s\npppoe_account=%s\npppoe_password=%s\n' \
            "$ENABLE_PPPOE" "$PPPOE_ACCOUNT" "$PPPOE_PASSWORD" \
            > files/etc/config/pppoe-settings
          printf 'enable_ipv6=%s\n' "$ENABLE_IPV6" > files/etc/config/ipv6-settings
          echo "--- pppoe-settings ---"
          cat files/etc/config/pppoe-settings
          echo "--- ipv6-settings ---"
          cat files/etc/config/ipv6-settings

      - name: Configure
        run: |
          cp config.seed .config
          make defconfig

      - name: Download sources
        run: make download -j$(nproc)

      - name: Build Firmware
        run: |
          make -j2 world 2>&1 | tee build.log

      - name: Check build status
        run: |
          if [ -f build.log ]; then
            tail -100 build.log
          fi
          echo "=== List all files in bin/targets/airoha/an7581/ ==="
          ls -la bin/targets/airoha/an7581/ 2>/dev/null || echo "No files found in an7581 directory"
          echo "=== List all files in bin/targets/airoha/ ==="
          ls -la bin/targets/airoha/ 2>/dev/null || echo "No files found in airoha directory"
          echo "=== List all files in bin/targets/ ==="
          ls -la bin/targets/ 2>/dev/null || echo "No files found in targets directory"
          echo "=== List all files in bin/ ==="
          ls -la bin/ 2>/dev/null || echo "No files found in bin directory"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: router-firmware
          path: |
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/version.buildinfo
            bin/targets/airoha/an7581/sha256sums
          retention-days: 30
        if: always()

      - name: Build release body
        if: github.event.inputs.release_type != 'none'
        id: release_body
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          BUILD_DATE: ${{ steps.date.outputs.date }}
          BUILD_COMMIT: ${{ steps.commit.outputs.short }}
        run: |
          BUILD_TIME_BJ="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S' 2>/dev/null || date -u -d '+8 hours' '+%Y-%m-%d %H:%M:%S')"
          sed -e "s/@DATE@/${BUILD_DATE}/g" \
              -e "s/@COMMIT@/${BUILD_COMMIT}/g" \
              -e "s/@TIME@/${BUILD_TIME_BJ}/g" \
              .github/RELEASE_BODY.md > /tmp/release_body.md
          if [ -n "${RELEASE_NOTES}" ]; then
            {
              echo ""
              printf '%s\n' "${RELEASE_NOTES}"
            } >> /tmp/release_body.md
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "如果您觉得对您有帮助，请我喝杯咖啡吧，让我更有动力持续更新。"
            echo ""
            echo '<img width="400" height="400" alt="c6ea388c976395326514814f80d512d5" src="https://github.com/user-attachments/assets/0ac90d58-ac73-4dc1-b926-276e539e5d0f" />'
          } >> /tmp/release_body.md
          {
            echo "body<<EOF"
            cat /tmp/release_body.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event.inputs.release_type != 'none'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ format('{0}-{1}', steps.date.outputs.date, steps.commit.outputs.short) }}
          name: ${{ format('{0} - XR1710G Build ({1})', steps.date.outputs.date, steps.commit.outputs.short) }}
          body: ${{ steps.release_body.outputs.body }}
          draft: false
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          files: |
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/version.buildinfo
            bin/targets/airoha/an7581/sha256sums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
